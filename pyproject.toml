[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "osintgym"
version = "0.1.0"
description = "Reproducible, sandboxed benchmark for OSINT agents: capability, harness and safeguard evaluation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-DATA.md", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Durandir Technologies" }]
keywords = ["osint", "benchmark", "agents", "llm", "evaluation", "safety"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27,<1",
    "pillow>=10.4",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.70"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://osintgym.com"
Repository = "https://github.com/0x72656e7675/osintgym-benchmark"

[project.scripts]
osintgym = "osintgym.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/osintgym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
